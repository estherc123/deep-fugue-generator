[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fugue-data"
version = "0.1.0"
description = "Reproducible symbolic-music data pipeline for a fugue-composition system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
fugue-data = "fugue_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: touches the full normalized corpus on disk"]
