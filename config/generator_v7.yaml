# Generator v7: v5's full data (Corelli and Vivaldi kept, no fugue weighting)
# at v6's larger size. Why: on held-out WTC fugues (free-note ppl) v5 1.79,
# v6 (larger, cleaned data, fugues x3) 1.90, v6b (v5 size, cleaned data) 2.01:
# removing data hurt, the larger model helped. Crossings and repeated notes
# that Corelli/Vivaldi teach are handled at decoding (--no-crossing,
# --repeat-penalty).
seed: 0
out: data/models/generator_v7.pt
baroque: true
labels: true
plan_dropout: 0.3
chord_dropout: 0.3

model:
  d: 512
  layers: 10
  heads: 8
  ctx: 2048
  dropout: 0.2

optim:
  lr: 2.5e-4
  weight_decay: 0.1
  warmup: 400
  batch: 16
  max_steps: 40000

log_every: 100
eval_every: 500
patience: 8
