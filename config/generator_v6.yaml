# Generator v6: v5 minus the sources that teach habits fugues don't have, with
# fugues weighted up, and a larger model for the larger corpus.
#
# Left out of the note model (kept for harmony/form statistics):
#   vivaldi-op6   orchestral doubling: 27% unisons, 23% repeated notes
#   dcml-corelli  trio-sonata violins cross 13.6% of the time (WTC fugues 1.1%)
seed: 0
out: data/models/generator_v6.pt
baroque: true
labels: true
exclude_sources: [vivaldi-op6, dcml-corelli]
corpus_weight: {fugue: 3.0}
plan_dropout: 0.3
chord_dropout: 0.3

model:
  d: 512
  layers: 10
  heads: 8
  ctx: 2048
  dropout: 0.2

optim:
  lr: 2.5e-4
  weight_decay: 0.1
  warmup: 400
  batch: 16
  max_steps: 40000

log_every: 100
eval_every: 500
patience: 8
