# Authoritative data sources for the Fugue data collection pipeline.
# Every source is pinned to an immutable commit SHA (Section 4.1).
# Revisions are resolved from the branch tip at acquisition-plan time and then
# frozen here; the acquire stage checks out the detached SHA, never a moving branch.

schema_version: "1.0.0"

sources:
  - source_name: humdrum-wtc
    repository_url: https://github.com/humdrum-tools/bach-wtc.git
    # Resolved from refs/heads/main on 2026-07-30
    repository_commit: 0b4f4d84b90b254615e7ac09730ec473c9611cb6
    default_branch: main
    license_name: null            # No SPDX license declared in repo; treat as unknown
    license_url: null
    license_scope: encoding
    commercial_use_known: false
    attribution_required: null
    # Files that define the accepted default fugue corpus.
    selection:
      # WTC book I and II fugues: wtc{1,2}f{01..24}
      fugue_glob: "**/wtc?f??.krn"
      # Preludes preserved as raw but excluded from the default fugue dataset.
      prelude_glob: "**/wtc?p??.krn"
    primary_format: kern

  - source_name: algomus
    repository_url: https://gitlab.com/algomus.fr/algomus-data.git
    # Resolved from refs/heads/master on 2026-07-30
    repository_commit: a1801b5b42a4f8d99783e1e52b3dc2e7407cd5ef
    default_branch: master
    license_name: null
    license_url: https://www.algomus.fr/fugues/
    license_scope: annotation
    commercial_use_known: false
    attribution_required: true
    selection:
      # Structural annotations for the 24 WTC I fugues (subjects, countersubjects,
      # cadences, pedals). Concrete globs are refined after inspecting the tree.
      annotation_glob: "**/*fugue*/**/*"
    primary_format: json

  - source_name: bcfb
    repository_url: https://github.com/juyaolongpaul/Bach_chorale_FB.git
    # Resolved from refs/heads/master on 2026-07-30
    repository_commit: 431c5c019aeea198c0128a05dd1d2a7364c2d786
    default_branch: master
    license_name: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    license_scope: encoding
    commercial_use_known: true
    attribution_required: true
    selection:
      musicxml_glob: "**/*.musicxml"
      musicxml_alt_glob: "**/*.xml"
      kern_glob: "**/*.krn"
      mei_glob: "**/*.mei"
    primary_format: musicxml
