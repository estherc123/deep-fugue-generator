# Rule profile: species_strict (Spec §15.2).
#
# Fux-style strict species reading. The most restrictive profile: useful as
# a teaching baseline and as a lower bound on what any generator can
# produce, NOT as a description of Bach.
# Empirical calibration (§15.6): this profile is deliberately NOT calibrated to
# Bach. Eight of its hard rules fire on real Bach, which is the point -- it is
# the strict species reading, useful as a lower bound and a teaching baseline,
# never as a description of what Bach wrote.
profile: species_strict
ruleset_version: "1.0.0"

# Range profiles in MIDI numbers, highest voice first (§15.5). A fragment
# selects one by `range_profile`; keyboard fugues are not SATB voices, so
# applying a vocal tessitura to the WTC would flag Bach himself.
range_profiles:
  satb:
    voice_1: [60, 84]
    voice_2: [53, 79]
    voice_3: [48, 72]
    voice_4: [36, 64]
    voice_5: [36, 64]
    default: [36, 84]
  keyboard:
    voice_1: [36, 96]
    voice_2: [33, 93]
    voice_3: [29, 88]
    voice_4: [24, 84]
    voice_5: [24, 81]
    default: [24, 96]
default_range_profile: keyboard

parameters:
  parallel_requires_metric_onset: false
  max_leap_semitones: 8
  voice_spacing_max_semitones: 12
  min_voice_participation: 0.3
  max_dead_air_q: 2
  allow_octave_leap: True

# severity: off | diagnostic | soft | hard (§15.3)
severities:
  timing_nonnegative_onset: "hard"
  timing_positive_duration: "hard"
  timing_within_bounds: "hard"
  voice_monophonic: "hard"
  voice_range: "hard"
  voice_spacing: "hard"
  voice_overlap: "hard"
  voice_crossing: "soft"
  parallel_fifths: "hard"
  parallel_octaves: "hard"
  direct_fifths_outer: "soft"
  melodic_leap_limit: "hard"
  augmented_interval_melodic: "hard"
  leap_recovery: "soft"
  leading_tone_resolution: "hard"
  suspension_resolution: "hard"
  dissonance_treatment: "hard"
  subject_entry_identity: "hard"
  answer_transformation: "hard"
  cadence_target_completion: "hard"
  voice_participation: "hard"
  max_dead_air: "hard"
  section_length_limit: "hard"
  structural_target_reachable: "hard"
