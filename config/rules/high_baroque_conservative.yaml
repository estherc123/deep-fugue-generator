# Rule profile: high_baroque_conservative (Spec §15.2).
#
# Default generation profile. Keeps the parallels and the structural targets
# hard, relaxes the melodic and spacing rules that Bach plainly and
# routinely breaks.
# Empirical calibration (§15.6), measured on the 41 held-out real Bach pieces:
#
#   suspension_resolution  demoted hard -> soft. Measured false-positive rate
#     0.22 after two rounds of refinement (preparation + metric-strength
#     context). A rule that fires on a fifth of real Bach is not a hard law of
#     the style, whatever the textbooks say.
#   voice_monophonic       kept hard, and this is a deliberate divergence from
#     Bach rather than a claim about him: real keyboard writing carries brief
#     divisi (fp 0.12), but generated voices are strictly monophonic by design.
#   parallel_fifths        hard, fp 0.00 once ornamental offbeat parallels are
#     excluded (see parallel_requires_metric_onset).
#
# OPEN FINDING for the next ruleset version (§25.3 requires a version bump and a
# documented migration, so this is recorded rather than applied):
#
#   The severities above were set from a per-PIECE false-positive rate, which is
#   a poor metric for event-level rules -- a 1,500-note fugue with one offending
#   note scores the same as one with two hundred. Measured per 1000 notes on the
#   same held-out corpus:
#
#     melodic_leap_limit       per-piece 0.20  but only  1.1 / 1000 notes
#     suspension_resolution    per-piece 0.22  but only  1.1 / 1000 notes
#     leap_recovery            per-piece 1.00  and      50.6 / 1000 notes
#
#   The first two are rules Bach effectively observes and were demoted on a
#   misleading number; both are candidates to be hard in ruleset 1.1.0. The third
#   is correctly soft: Bach really does bend it about once every twenty notes.
#   Changing any of these invalidates the ruleset_hash stamped on every generated
#   fragment, so it must be a deliberate, versioned migration.
profile: high_baroque_conservative
ruleset_version: "1.0.0"

# Range profiles in MIDI numbers, highest voice first (§15.5). A fragment
# selects one by `range_profile`; keyboard fugues are not SATB voices, so
# applying a vocal tessitura to the WTC would flag Bach himself.
range_profiles:
  satb:
    voice_1: [60, 84]
    voice_2: [53, 79]
    voice_3: [48, 72]
    voice_4: [36, 64]
    voice_5: [36, 64]
    default: [36, 84]
  keyboard:
    voice_1: [36, 96]
    voice_2: [33, 93]
    voice_3: [29, 88]
    voice_4: [24, 84]
    voice_5: [24, 81]
    default: [24, 96]
default_range_profile: keyboard

parameters:
  parallel_requires_metric_onset: true
  max_leap_semitones: 12
  voice_spacing_max_semitones: 16
  min_voice_participation: 0.2
  max_dead_air_q: 4
  allow_octave_leap: True

# severity: off | diagnostic | soft | hard (§15.3)
severities:
  timing_nonnegative_onset: "hard"
  timing_positive_duration: "hard"
  timing_within_bounds: "hard"
  voice_monophonic: "hard"
  voice_range: "hard"
  voice_spacing: "soft"
  voice_overlap: "soft"
  voice_crossing: "diagnostic"
  parallel_fifths: "hard"
  parallel_octaves: "hard"
  direct_fifths_outer: "diagnostic"
  melodic_leap_limit: "soft"
  augmented_interval_melodic: "soft"
  leap_recovery: "soft"
  leading_tone_resolution: "soft"
  suspension_resolution: "soft"
  dissonance_treatment: "soft"
  subject_entry_identity: "hard"
  answer_transformation: "hard"
  cadence_target_completion: "hard"
  voice_participation: "hard"
  max_dead_air: "hard"
  section_length_limit: "hard"
  structural_target_reachable: "hard"
